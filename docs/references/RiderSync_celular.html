<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>RiderSync</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Stencil+Display:wght@800;900&family=Figtree:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap">
<style>
/* Layout: classificados — cabeçalho escuro de "case" com busca, faixa de categorias, filtros à esquerda e grade de anúncios.
   Identidade: estêncil de case de equipamento, fita amarela de gaffer e capas geradas em estilo cartaz de show. */
:root{
  --bg:#EDEFED; --surface:#FFFFFF; --sunk:#E3E6E3; --ink:#111315; --muted:#5D6561; --line:#D8DCD8;
  --case:#151719; --case-2:#212427; --case-ink:#F1F2F0; --case-muted:#9AA19D;
  --cue:#FFC83A; --cue-ink:#1B1500; --teal:#0B766E; --teal-soft:#D9EEEB; --tally:#E0443F;
  --ok:#1E7A45; --ok-bg:#E2F2E8; --warn:#935D00; --warn-bg:#FBEFD2; --bad:#B0352B; --bad-bg:#F8E2DF; --info:#3F5F75; --info-bg:#E3ECF2;
  --shadow:0 1px 2px rgb(17 19 21 / .06),0 12px 32px rgb(17 19 21 / .08);
  --stencil:"Big Shoulders Stencil Display","Arial Narrow","Roboto Condensed",Impact,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0C0E0F; --surface:#16191B; --sunk:#1F2325; --ink:#ECEFED; --muted:#99A19D; --line:#2A2F31;
  --case:#060708; --case-2:#16191B; --teal:#3FB6AB; --teal-soft:#14302D; --tally:#F0625C;
  --ok:#62CB8F; --ok-bg:#15301F; --warn:#E8B24E; --warn-bg:#33270F; --bad:#F08B80; --bad-bg:#3A1C19; --info:#8EB4CD; --info-bg:#192A35;
  --shadow:0 1px 2px rgb(0 0 0 / .4),0 12px 32px rgb(0 0 0 / .45); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0C0E0F; --surface:#16191B; --sunk:#1F2325; --ink:#ECEFED; --muted:#99A19D; --line:#2A2F31;
  --case:#060708; --case-2:#16191B; --teal:#3FB6AB; --teal-soft:#14302D; --tally:#F0625C;
  --ok:#62CB8F; --ok-bg:#15301F; --warn:#E8B24E; --warn-bg:#33270F; --bad:#F08B80; --bad-bg:#3A1C19; --info:#8EB4CD; --info-bg:#192A35;
  --shadow:0 1px 2px rgb(0 0 0 / .4),0 12px 32px rgb(0 0 0 / .45); color-scheme:dark}

*,*::before,*::after{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:400 15px/1.5 var(--body);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--case)}
a{color:inherit}
h1,h2,h3{margin:0;text-wrap:balance}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--teal);outline-offset:2px;border-radius:6px}
h1[tabindex]:focus{outline:none}
.wrap{max-width:1240px;margin-inline:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.muted{color:var(--muted)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.lbl{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.skip{position:absolute;left:-999px;top:8px;z-index:60;background:var(--cue);color:var(--cue-ink);padding:8px 12px;border-radius:8px}
.skip:focus{left:16px}

/* Fita de gaffer (marca) */
.tape{display:inline-block;background:var(--cue);color:var(--cue-ink);font:800 11px/1 var(--body);letter-spacing:.07em;text-transform:uppercase;padding:6px 9px 5px;rotate:-2deg;clip-path:polygon(1.5% 6%,98% 0,100% 48%,98.5% 100%,2% 94%,0 52%)}
.logo{display:inline-flex;align-items:center;text-decoration:none;font-family:var(--stencil);font-weight:900;font-size:27px;line-height:1;letter-spacing:.03em;background:var(--cue);color:var(--cue-ink);padding:6px 13px 3px;rotate:-2deg;clip-path:polygon(1% 8%,98.5% 0,100% 50%,98% 100%,2% 93%,0 48%);white-space:nowrap}

/* Cabeçalho (case) */
.hdr{background:var(--case);color:var(--case-ink);position:sticky;top:env(safe-area-inset-top,0px);z-index:25}
.hdr .wrap{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:22px;align-items:center;padding-block:12px}
.hs{display:flex;background:var(--surface);color:var(--ink);border-radius:12px;height:46px;overflow:hidden;min-width:0;box-shadow:0 0 0 1px rgb(255 255 255 / .06)}
.hs input{flex:1;min-width:0;border:0;background:none;padding:0 14px;outline:none}
.hs select{border:0;border-left:1px solid var(--line);background:none;padding:0 12px;max-width:170px;outline:none;cursor:pointer}
.hs button{border:0;background:var(--cue);color:var(--cue-ink);padding:0 18px;display:grid;place-items:center;cursor:pointer;font-weight:700}
.hs:focus-within{box-shadow:0 0 0 3px var(--cue)}
.hact{display:flex;align-items:center;gap:8px}
.hlink{color:var(--case-ink);text-decoration:none;font-weight:600;padding:8px 10px;border-radius:9px;display:inline-flex;gap:8px;align-items:center;background:none;border:0;cursor:pointer;white-space:nowrap}
.hlink:hover{background:var(--case-2)}
.hlink .n{background:var(--tally);color:#fff;font-size:11px;font-weight:700;border-radius:999px;padding:1px 6px}
.menu{position:absolute;right:max(16px,env(safe-area-inset-right,0px));top:62px;background:var(--surface);color:var(--ink);border-radius:14px;box-shadow:var(--shadow);padding:6px;min-width:230px;display:grid;border:1px solid var(--line)}
.menu a,.menu button{text-align:left;padding:10px 12px;border-radius:9px;text-decoration:none;background:none;border:0;cursor:pointer}
.menu a:hover,.menu button:hover{background:var(--sunk)}
.menu hr{border:0;border-top:1px solid var(--line);margin:4px 6px}

/* Botões e campos */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:42px;padding:0 18px;border-radius:11px;border:1px solid var(--line);background:var(--surface);font-weight:700;text-decoration:none;cursor:pointer;white-space:nowrap;transition:background .15s,border-color .15s,transform .1s}
.btn:hover{border-color:color-mix(in oklab,var(--ink) 30%,var(--line))}
.btn:active{transform:translateY(1px)}
.btn.cue{background:var(--cue);border-color:var(--cue);color:var(--cue-ink)}
.btn.cue:hover{background:color-mix(in oklab,var(--cue) 88%,#000)}
.btn.dark{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.btn.ghost{background:none;border-color:transparent}
.btn.ghost:hover{background:var(--sunk)}
.btn.sm{height:34px;padding:0 12px;font-size:14px;border-radius:9px}
.btn.block{width:100%}
.btn.danger{color:var(--bad)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.hdr .btn{border-color:transparent}
.link{background:none;border:0;padding:0;color:var(--teal);font-weight:700;cursor:pointer;text-decoration:none}
.link:hover{text-decoration:underline}
.field{display:grid;gap:6px;min-width:0}
.field>span{font-size:14px;font-weight:600}
.field small{color:var(--muted);font-size:13px}
.input{width:100%;height:44px;padding:0 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);transition:border-color .15s,box-shadow .15s}
textarea.input{height:auto;min-height:120px;padding:10px 12px;resize:vertical;line-height:1.5}
.input:hover{border-color:color-mix(in oklab,var(--ink) 25%,var(--line))}
.input:focus{outline:none;border-color:var(--teal);box-shadow:0 0 0 3px var(--teal-soft)}
.input[aria-invalid="true"]{border-color:var(--bad)}
.money{position:relative}
.money::before{content:"R$";position:absolute;left:12px;top:50%;translate:0 -50%;color:var(--muted);font-weight:600;font-size:14px}
.money .input{padding-left:38px}
.err{color:var(--bad);font-size:13px;font-weight:600}
.chip{display:inline-flex;align-items:center;height:26px;padding:0 10px;border-radius:999px;background:var(--sunk);font-size:13px;font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.pick{display:flex;flex-wrap:wrap;gap:8px}
.pick label{cursor:pointer;position:relative}
.pick input{position:absolute;opacity:0;pointer-events:none}
.pick span{display:inline-flex;align-items:center;height:36px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:14px;font-weight:600;transition:.15s}
.pick input:checked+span{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.pick input:focus-visible+span{outline:2px solid var(--teal);outline-offset:2px}
.check{display:flex;align-items:center;gap:10px;cursor:pointer;font-size:14px;padding:5px 0}
.check input{width:18px;height:18px;accent-color:var(--ink)}
.seg{display:inline-flex;padding:4px;gap:2px;background:var(--sunk);border-radius:12px;max-width:100%;overflow-x:auto}
.seg button{border:0;background:none;padding:8px 14px;border-radius:9px;font-weight:700;font-size:14px;color:var(--muted);cursor:pointer;white-space:nowrap}
.seg button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgb(0 0 0 / .1)}
.tabs{display:flex;gap:26px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.tabs button{border:0;background:none;padding:12px 0;font-weight:700;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-1px;white-space:nowrap;display:inline-flex;gap:6px;align-items:center}
.tabs button[aria-selected="true"]{color:var(--ink);border-color:var(--cue)}
.tabs .n{font-size:12px;background:var(--sunk);border-radius:999px;padding:1px 7px}

/* Capas (cartaz gerado) */
.cover{position:relative;overflow:hidden;container-type:inline-size;background:var(--sunk);aspect-ratio:4/3;max-width:100%}
.cover img{width:100%;height:100%;object-fit:cover;display:block}
.poster{background:var(--pb);color:var(--pf);display:flex;flex-direction:column;justify-content:space-between;padding:6.5% 7% 6%}
.poster::before{content:"";position:absolute;width:95cqi;height:95cqi;right:-28cqi;top:-26cqi;background-image:radial-gradient(circle,var(--pf) 0 36%,transparent 39%);background-size:3.4cqi 3.4cqi;-webkit-mask:radial-gradient(circle closest-side,#000 25%,transparent 100%);mask:radial-gradient(circle closest-side,#000 25%,transparent 100%);opacity:.5}
.poster.p1::before{right:auto;left:-34cqi;top:auto;bottom:-40cqi}
.poster.p2::before{right:-14cqi;top:22cqi;width:72cqi;height:72cqi}
.poster.p3::before{right:10cqi;top:-40cqi;width:120cqi;height:120cqi;opacity:.3}
.poster .pt{position:relative;font:600 max(9px,3.3cqi)/1.25 var(--mono);letter-spacing:.08em;text-transform:uppercase;display:flex;justify-content:space-between;gap:8px}
.poster .pn{position:relative;font-family:var(--stencil);font-weight:900;text-transform:uppercase;font-size:14.5cqi;line-height:.86;letter-spacing:.01em;overflow-wrap:anywhere;max-width:96%}
.poster .pr{position:relative;border-top:max(1px,.5cqi) solid currentColor;padding-top:2.2cqi;font:600 max(9px,3cqi)/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;display:flex;justify-content:space-between;gap:8px;opacity:.9}
.poster.p1 .pn{align-self:flex-end;text-align:right}

/* Faixa de categorias */
.cats{background:var(--surface);border-bottom:1px solid var(--line)}
.cats .wrap{display:flex;gap:4px;overflow-x:auto;padding-block:12px;scrollbar-width:none}
.cat{display:grid;justify-items:center;gap:6px;min-width:82px;padding:8px 6px;border-radius:12px;text-decoration:none;font-size:13px;font-weight:700;background:none;border:0;cursor:pointer;color:var(--ink)}
.cat .ci{width:46px;height:46px;border-radius:50%;background:var(--sunk);display:grid;place-items:center;transition:.15s}
.cat:hover .ci{background:color-mix(in oklab,var(--cue) 35%,var(--sunk))}
.cat[aria-pressed="true"] .ci{background:var(--cue);color:var(--cue-ink)}
.cat .sep{width:1px;background:var(--line)}
.vsep{flex:none;width:1px;background:var(--line);margin:8px 6px}

/* Marketplace */
.mk{display:grid;grid-template-columns:250px minmax(0,1fr);gap:28px;padding-block:24px 72px;align-items:start}
.filters{display:grid;gap:22px;position:sticky;top:96px}
.fgroup{display:grid;gap:6px}
.fgroup h3{margin-bottom:4px}
.range{display:grid;gap:6px}
.range input{width:100%;accent-color:var(--ink)}
.range output{font-weight:700}
.promo{background:var(--case);color:var(--case-ink);border-radius:14px;padding:18px;display:grid;gap:10px}
.promo p{color:var(--case-muted);font-size:14px}
.rhead{display:flex;align-items:end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.rhead h1{font-size:22px;font-weight:800}
.rtools{display:flex;gap:8px;align-items:center}
.rtools select{width:auto;height:38px}
.fbtn{display:none}
.ads{display:grid;grid-template-columns:repeat(auto-fill,minmax(225px,1fr));gap:16px}
.ad{position:relative;background:var(--surface);border-radius:14px;overflow:hidden;transition:box-shadow .18s,transform .18s}
.ad:hover{box-shadow:var(--shadow);transform:translateY(-2px)}
.ad>a,.ad>.al{display:grid;text-decoration:none;height:100%}
.ad .tape{position:absolute;left:10px;top:12px;z-index:1;white-space:nowrap}
.ad .poster .pt{visibility:hidden}
.ad-b{padding:12px 14px 14px;display:grid;gap:3px;align-content:start}
.ad h3{font-size:15px;font-weight:600;line-height:1.3}
.ad .sub{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.price{font-size:20px;font-weight:800;letter-spacing:-.01em;margin-top:6px;font-variant-numeric:tabular-nums}
.price small{display:block;font-size:12px;font-weight:600;color:var(--muted);letter-spacing:0}
.loc{display:flex;justify-content:space-between;gap:8px;font-size:12.5px;color:var(--muted);margin-top:8px}
.rate{display:inline-flex;align-items:center;gap:4px;font-weight:700;color:var(--ink)}
.rate svg{color:var(--cue)}
.fav{position:absolute;right:10px;top:10px;z-index:2;width:38px;height:38px;border-radius:50%;border:0;background:color-mix(in oklab,var(--surface) 92%,transparent);display:grid;place-items:center;cursor:pointer;color:var(--ink);box-shadow:0 1px 4px rgb(0 0 0 / .15)}
.fav[aria-pressed="true"] svg{fill:var(--tally);color:var(--tally)}
.empty{padding:56px 20px;text-align:center;color:var(--muted);background:var(--surface);border-radius:14px;display:grid;gap:10px;justify-items:center}
.empty strong{color:var(--ink);font-size:17px}

/* Página do anúncio */
.page{padding-block:20px 72px}
.bc{display:flex;flex-wrap:wrap;gap:6px;font-size:13px;color:var(--muted);margin-bottom:16px;list-style:none;padding:0}
.bc li+li::before{content:"›";margin-right:6px}
.bc a{text-decoration:none}
.bc a:hover{color:var(--ink);text-decoration:underline}
.adp{display:grid;grid-template-columns:minmax(0,1fr) 350px;gap:28px;align-items:start}
.gal{display:grid;gap:8px;background:var(--case);border-radius:16px;padding:8px}
.gal-main{border-radius:11px;overflow:hidden}
.gal-main .cover{aspect-ratio:16/10}
.gal-th{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
.gal-th button{flex:none;width:92px;border-radius:8px;overflow:hidden;border:2px solid transparent;padding:0;cursor:pointer;background:none;opacity:.6}
.gal-th button[aria-current="true"]{border-color:var(--cue);opacity:1}
.box{background:var(--surface);border-radius:16px;padding:22px;display:grid;gap:16px}
.adh{display:grid;gap:8px}
.adh h1{font-size:clamp(24px,3vw,32px);font-weight:800;line-height:1.15;letter-spacing:-.01em}
.adh .price{font-size:30px;margin:0}
.pub{font-size:13px;color:var(--muted)}
.sec{display:grid;gap:12px}
.sec>h2{font-size:18px;font-weight:800}
.prose{max-width:68ch;font-size:16px;line-height:1.65;white-space:pre-line}
.attrs{display:grid;grid-template-columns:1fr 1fr;column-gap:32px;margin:0}
.attrs div{display:flex;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.attrs dt{color:var(--muted)}
.attrs dd{margin:0;font-weight:700;text-align:right}
.side{display:grid;gap:14px;position:sticky;top:96px}
.seller{display:flex;gap:14px;align-items:center}
.seller .av{flex:none}
.seller div{display:grid;gap:2px;min-width:0}
.seller small{color:var(--muted);font-size:13px}
.av{display:grid;place-items:center;border-radius:50%;overflow:hidden;font-family:var(--stencil);font-weight:900;letter-spacing:.02em;flex:none}
.av img{width:100%;height:100%;object-fit:cover}
.stats{display:grid;grid-template-columns:repeat(3,1fr);text-align:center;border-block:1px solid var(--line);padding-block:12px}
.stats b{display:block;font-size:18px;font-variant-numeric:tabular-nums}
.stats span{font-size:12px;color:var(--muted)}
.contact{display:grid;gap:10px;margin:0}
.contact div{display:flex;justify-content:space-between;gap:10px;align-items:center}
.contact dt{font-size:13px;color:var(--muted)}
.contact dd{margin:0;font-weight:700;word-break:break-all}
.copy{border:0;background:var(--sunk);border-radius:6px;padding:4px 8px;font-size:12px;font-weight:700;cursor:pointer;color:var(--muted);flex:none}
.tip{display:flex;gap:10px;font-size:13px;color:var(--muted);background:var(--sunk);border-radius:12px;padding:12px}
.tip svg{flex:none;color:var(--ink);margin-top:1px}
.members{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.members a{display:flex;gap:12px;align-items:center;text-decoration:none;padding:10px;border-radius:12px;border:1px solid var(--line)}
.members a:hover{border-color:var(--ink)}
.members small{display:block;color:var(--muted);font-size:13px}
.role{font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:3px 7px;border-radius:6px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.role.owner{background:var(--cue);color:var(--cue-ink)}
.ilist{list-style:none;margin:0;padding:0;display:grid}
.ilist li{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:12px;align-items:baseline;padding:10px 0;border-top:1px solid var(--line)}
.ilist li:first-child{border-top:0}
.ch{font-family:var(--mono);font-size:12px;font-weight:600;color:var(--muted)}
.ilist small{display:block;color:var(--muted);font-size:13px}
.qty{font-family:var(--mono);font-size:14px;white-space:nowrap}
.icat{margin-top:6px}
.dates{list-style:none;margin:0;padding:0;display:grid}
.dates li{display:grid;grid-template-columns:58px 1fr;gap:14px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.dates li:first-child{border-top:0}
.dt{display:grid;justify-items:center;line-height:1;padding:8px 0;border-radius:10px;background:var(--case);color:var(--case-ink)}
.dt b{font-family:var(--stencil);font-size:24px;font-weight:900}
.dt small{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--cue)}
.pf{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.pf a{display:grid;gap:3px;padding:14px;border-radius:12px;border:1px solid var(--line);text-decoration:none}
.pf a:hover{border-color:var(--ink)}
.pf small{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--teal)}
.reviews{display:grid;gap:14px}
.rev{display:grid;gap:4px;padding-top:14px;border-top:1px solid var(--line)}
.rev:first-child{border-top:0;padding-top:0}
.rev header{display:flex;justify-content:space-between;gap:8px;font-size:14px}
.stars{color:var(--cue);letter-spacing:1px}
.score{display:flex;gap:16px;align-items:center}
.score b{font-family:var(--stencil);font-size:52px;line-height:.9;font-weight:900}
.st{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:999px;font-size:13px;font-weight:700;white-space:nowrap}
.st::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.st.ok{background:var(--ok-bg);color:var(--ok)}
.st.parcial{background:var(--warn-bg);color:var(--warn)}
.st.falta{background:var(--bad-bg);color:var(--bad)}
.st.conferir{background:var(--info-bg);color:var(--info)}
.st.pend{background:var(--warn-bg);color:var(--warn)}
.st.pub{background:var(--ok-bg);color:var(--ok)}
.st.draft{background:var(--sunk);color:var(--muted)}
.tscroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px;min-width:560px}
th{text-align:left;font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:8px 10px;border-bottom:1px solid var(--line)}
td{padding:11px 10px;border-bottom:1px solid var(--line);vertical-align:top}
td.n{font-family:var(--mono);white-space:nowrap}
tr:last-child td{border-bottom:0}
.note{font-size:13px;color:var(--muted)}
.cmp-f{display:flex;gap:8px;flex-wrap:wrap;align-items:end}
.cmp-f .field{flex:1 1 200px}
.sum{display:flex;flex-wrap:wrap;gap:6px}
.similar{margin-top:40px;display:grid;gap:14px}
.rowscroll{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(220px,1fr);gap:16px;overflow-x:auto;padding-bottom:6px}

/* Conta */
.acc{padding-block:28px 72px;display:grid;gap:24px}
.acc-h{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.acc-h h1{font-size:28px;font-weight:800}
.prow{display:grid;grid-template-columns:132px minmax(0,1fr) auto;gap:18px;align-items:center;background:var(--surface);border-radius:14px;padding:12px}
.prow .cover{border-radius:10px}
.prow h3{font-size:16px;font-weight:700}
.prow .meta{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--muted);margin-top:6px;align-items:center}
.prow .acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.bar{height:6px;border-radius:999px;background:var(--sunk);overflow:hidden;width:90px;display:inline-block;vertical-align:middle}
.bar i{display:block;height:100%;background:var(--teal)}
.prop{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:16px;align-items:center;background:var(--surface);border-radius:14px;padding:16px}
.prop .dt{width:58px}
.prop p{font-size:14px}
.newgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.newc{display:grid;gap:12px;text-align:left;background:var(--surface);border:2px solid transparent;border-radius:16px;padding:0 0 18px;cursor:pointer;overflow:hidden;transition:.15s}
.newc:hover:not([disabled]){border-color:var(--ink);box-shadow:var(--shadow)}
.newc>*:not(.cover){padding-inline:18px}
.newc[disabled]{cursor:not-allowed;opacity:.55}

/* Editor */
.ed{display:grid;grid-template-columns:190px minmax(0,1fr) 270px;gap:24px;align-items:start;padding-block:24px 96px}
.steps{display:grid;gap:2px;position:sticky;top:96px;counter-reset:s}
.steps a{display:flex;gap:10px;align-items:center;padding:9px 10px;border-radius:10px;text-decoration:none;color:var(--muted);font-weight:600;font-size:14px}
.steps a::before{counter-increment:s;content:counter(s);width:22px;height:22px;border-radius:50%;background:var(--sunk);display:grid;place-items:center;font-size:12px;font-weight:800;color:var(--ink);flex:none}
.steps a:hover{background:var(--surface);color:var(--ink)}
.eform{display:grid;gap:18px;min-width:0}
.eform .box>h2{font-size:18px;font-weight:800}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
.preview{position:sticky;top:96px;display:grid;gap:10px}
.preview .ad:hover{transform:none}
.savebar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:color-mix(in oklab,var(--surface) 94%,transparent);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.savebar .wrap{display:flex;gap:10px;align-items:center;justify-content:flex-end;padding-block:10px}
.savebar .msg{margin-right:auto;font-size:14px;font-weight:600}
.dirty{color:var(--warn)}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}
.ph{position:relative;border-radius:10px;overflow:hidden}
.ph .rm{position:absolute;right:6px;top:6px;width:28px;height:28px;border-radius:50%;border:0;background:var(--surface);display:grid;place-items:center;cursor:pointer;box-shadow:0 1px 3px rgb(0 0 0 / .2)}
.ph .tape{position:absolute;left:6px;bottom:8px}
.phadd{display:grid;place-items:center;gap:4px;aspect-ratio:4/3;border:2px dashed var(--line);border-radius:10px;cursor:pointer;color:var(--muted);font-size:13px;font-weight:600;text-align:center;padding:8px}
.phadd:hover{border-color:var(--ink);color:var(--ink)}
.dyn{display:grid;gap:8px}
.dynrow{display:grid;grid-template-columns:130px 1fr 1.4fr auto;gap:8px;align-items:center}
.iconbtn{width:36px;height:36px;border-radius:50%;border:0;background:none;display:grid;place-items:center;cursor:pointer;color:var(--muted)}
.iconbtn:hover{background:var(--sunk);color:var(--bad)}
.errlist{background:var(--bad-bg);color:var(--bad);border-radius:12px;padding:14px 16px;font-size:14px;font-weight:600}
.errlist ul{margin:6px 0 0;padding-left:18px;font-weight:500}
.errlist a{color:inherit}
.mlist{list-style:none;margin:0;padding:0;display:grid}
.mlist li{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.mlist li:first-child{border-top:0}
.mlist select.input{height:36px;width:auto}
.inline-msg{padding:10px 14px;border-radius:10px;font-size:14px;font-weight:600}
.inline-msg.bad{background:var(--bad-bg);color:var(--bad)}
.inline-msg.ok{background:var(--ok-bg);color:var(--ok)}
.inline-msg.info{background:var(--info-bg);color:var(--info)}

/* Rider editor */
.rcat+.rcat{margin-top:18px}
.rcat h3{padding:0 10px 6px}
.rrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;align-items:center;padding:8px 10px;border-radius:10px}
.rrow:hover{background:var(--sunk)}
.rrow.on{background:color-mix(in oklab,var(--cue) 18%,var(--surface))}
.rchk{display:flex;align-items:center;gap:10px;cursor:pointer;font-weight:600;min-width:0}
.rchk input{width:18px;height:18px;accent-color:var(--ink);flex:none}
.rright{display:flex;align-items:center;gap:6px}
.step{display:inline-flex;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:2px}
.step button{width:28px;height:28px;border-radius:50%;border:0;background:none;cursor:pointer;font-size:16px;line-height:1}
.step button:hover{background:var(--sunk)}
.step output{min-width:28px;text-align:center;font-family:var(--mono);font-size:14px}
.step .u{font-size:12px;color:var(--muted);padding-right:8px}
.rrow:not(.on) .step{opacity:.3;pointer-events:none}
.obsbtn{border:0;background:none;color:var(--teal);font-size:13px;font-weight:700;cursor:pointer;padding:2px 6px}
.rrow:not(.on) .obsbtn,.rrow.showobs .obsbtn{display:none}
.robs{grid-column:1/-1;height:34px;font-size:14px}
.rrow:not(.on) .robs,.rrow:not(.showobs) .robs{display:none}
.orow{display:grid;grid-template-columns:1.5fr 80px 1.4fr auto;gap:8px;align-items:center}

/* Auth */
.auth{display:grid;grid-template-columns:1.05fr 1fr;min-height:calc(100dvh - 70px)}
.auth-art{background:var(--case);color:var(--case-ink);padding:48px;display:grid;align-content:space-between;gap:28px;overflow:hidden}
.auth-art .bigtitle{font-family:var(--stencil);font-weight:900;text-transform:uppercase;font-size:clamp(46px,6vw,84px);line-height:.88;max-width:10ch}
.auth-art .bigtitle em{font-style:normal;color:var(--cue)}
.auth-posters{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.auth-posters .cover{border-radius:8px}
.auth-posters>:nth-child(2){translate:0 18px}
.auth-f{display:grid;place-items:center;padding:40px max(16px,env(safe-area-inset-right,0px)) 40px max(16px,env(safe-area-inset-left,0px))}
.auth-c{width:100%;max-width:400px;display:grid;gap:20px}
.auth-c h1{font-size:28px;font-weight:800}
.or{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:13px}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.demo{display:grid;gap:8px}
.demo button{display:flex;gap:12px;align-items:center;text-align:left;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface);cursor:pointer}
.demo button:hover{border-color:var(--ink)}
.demo small{display:block;color:var(--muted);font-size:13px}

/* Diálogo */
dialog{border:0;border-radius:18px;padding:0;background:var(--surface);color:var(--ink);width:min(520px,calc(100% - 32px));box-shadow:var(--shadow);max-height:calc(100dvh - 32px)}
dialog::backdrop{background:rgb(0 0 0 / .5)}
.dlg{display:grid;gap:16px;padding:22px}
.dlg-h{display:flex;justify-content:space-between;align-items:start;gap:12px}
.dlg-h h2{font-size:20px;font-weight:800}
dialog.sheet{margin:auto 0 0;width:100%;max-width:100%;border-radius:18px 18px 0 0;max-height:85dvh}

.foot{background:var(--case);color:var(--case-muted);font-size:13px;padding-block:22px}
.foot .wrap{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center}
.foot .link{color:var(--cue)}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));translate:-50% 0;background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:12px;font-weight:700;font-size:14px;box-shadow:var(--shadow);z-index:70;max-width:calc(100% - 32px)}


  .ed{grid-template-columns:170px minmax(0,1fr)}
  .preview{display:none}


  .mk,.adp{grid-template-columns:1fr}
  .filters{display:none}
  .fbtn{display:inline-flex}
  .side{position:static}
  .auth{grid-template-columns:1fr;min-height:0}
  .auth-art{padding:28px max(16px,env(safe-area-inset-left,0px))}
  .auth-posters{display:none}
  .newgrid{grid-template-columns:1fr}
  .ed{grid-template-columns:1fr}
  .steps{position:static;display:flex;overflow-x:auto;gap:4px}
  .steps a{white-space:nowrap}


  .hdr .wrap{grid-template-columns:auto auto;row-gap:10px}
  .hs{grid-column:1/-1;grid-row:2}
  .hs select{max-width:118px}
  .hact{justify-self:end}
  .hlink .t{display:none}
  .hdr .btn .t{display:none}
  .logo{font-size:23px}
  .attrs{grid-template-columns:1fr}
  .row2,.row3{grid-template-columns:1fr}
  .prow{grid-template-columns:96px minmax(0,1fr)}
  .prow .acts{grid-column:1/-1;justify-content:flex-start}
  .prop{grid-template-columns:auto minmax(0,1fr)}
  .prop>:last-child{grid-column:1/-1}
  .dynrow{grid-template-columns:1fr auto}
  .dynrow>:nth-child(1),.dynrow>:nth-child(2){grid-column:1/-1}
  .orow{grid-template-columns:80px minmax(0,1fr) auto}
  .orow>:nth-child(1){grid-column:1/-1}
  .rrow{grid-template-columns:minmax(0,1fr)}
  .rright{justify-content:space-between}
  .rrow:not(.on) .rright{display:none}
  .mlist li{grid-template-columns:auto minmax(0,1fr)}
  .mlist li>:nth-child(n+3){grid-column:2;justify-self:start}
  .ads{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .ad-b{padding:10px 11px 12px}
  .price{font-size:17px}
  .ad .loc span+span{display:none}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important}}

/* ===== v4: app mobile dentro de uma moldura de celular ===== */
:root{--desk:#D7DBD7}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--desk:#000}}
:root[data-theme="dark"]{--desk:#000}
option,optgroup{background:var(--surface);color:var(--ink)}
html,body{height:100%}
body{background:var(--desk);overflow:hidden}
.stage{height:100%;display:flex;justify-content:center;align-items:center;gap:44px;padding-block:20px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.panel{width:250px;flex:none;display:grid;gap:12px;align-content:center;max-height:100%;overflow:auto;padding:4px}
.panel h2{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-top:8px}
.panel p{font-size:13px;color:var(--muted)}
.pbtn{display:flex;gap:10px;align-items:center;padding:9px 10px;border-radius:12px;border:2px solid transparent;background:var(--surface);cursor:pointer;text-align:left;width:100%}
.pbtn:hover{border-color:var(--line)}
.pbtn[aria-pressed="true"]{border-color:var(--ink)}
.pbtn small{display:block;color:var(--muted);font-size:12px}
.plinks{display:grid;gap:2px}
.plinks a{display:block;padding:8px 10px;border-radius:9px;text-decoration:none;font-weight:600;font-size:14px}
.plinks a:hover{background:var(--surface)}
.plinks a[aria-current="page"]{background:var(--cue);color:var(--cue-ink)}
.device{flex:none;width:400px;height:min(860px,100%);background:#0A0B0C;border-radius:58px;padding:11px;box-shadow:0 0 0 2px #2B2E30,0 30px 80px rgb(0 0 0 / .35);position:relative}
.scr{position:relative;height:100%;border-radius:47px;overflow:hidden;background:var(--bg);display:flex;flex-direction:column;isolation:isolate}
.island{position:absolute;top:11px;left:50%;translate:-50% 0;width:112px;height:32px;background:#000;border-radius:20px;z-index:60}
.sbar{flex:none;height:50px;display:flex;justify-content:space-between;align-items:center;padding:6px 30px 0 34px;background:var(--case);color:var(--case-ink);font-weight:700;font-size:15px;font-variant-numeric:tabular-nums}
.sbar .ic{display:flex;gap:6px;align-items:center}
.batt{width:24px;height:12px;border:1.5px solid currentColor;border-radius:4px;padding:1.5px;position:relative}
.batt::after{content:"";position:absolute;right:-4px;top:3px;width:2px;height:4px;background:currentColor;border-radius:1px}
.batt i{display:block;height:100%;width:72%;background:currentColor;border-radius:1.5px}
.sig{display:flex;gap:2px;align-items:flex-end;height:11px}
.sig i{width:3px;background:currentColor;border-radius:1px}
#app{flex:1;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;scrollbar-width:none;position:relative;outline:none}
#app::-webkit-scrollbar{display:none}
.toast{position:absolute;bottom:96px}
@media (max-width:1180px){.panel.r{display:none}}
@media (max-width:760px){.panel{display:none}}
@media (max-width:520px){
  .stage{padding:0;display:block}
  .device{width:100%;height:100%;border-radius:0;padding:0;box-shadow:none;background:var(--bg)}
  .scr{border-radius:0}
  .island,.sbar{display:none}
}

/* Barra de abas */
.tabbar{flex:none;display:grid;grid-template-columns:repeat(5,1fr);background:var(--surface);border-top:1px solid var(--line);padding:6px 4px 12px;position:relative;z-index:20}
.tb{display:grid;justify-items:center;gap:2px;text-decoration:none;font-size:11px;font-weight:700;color:var(--muted);position:relative;padding:4px 0}
.tb.on{color:var(--ink)}
.tb .badge{right:calc(50% - 22px);top:0}
.tb.plus .pl{width:48px;height:48px;border-radius:15px;background:var(--cue);color:var(--cue-ink);display:grid;place-items:center;margin-top:-20px;box-shadow:0 6px 16px rgb(0 0 0 / .22);rotate:-3deg}
.badge{position:absolute;top:-3px;right:-3px;background:var(--tally);color:#fff;font:700 10px/16px var(--body);min-width:16px;height:16px;border-radius:8px;padding:0 4px;font-style:normal;text-align:center}

/* Barras de topo */
.appbar{position:sticky;top:0;z-index:10;background:var(--case);color:var(--case-ink);display:flex;align-items:center;gap:10px;min-height:58px;padding:8px 14px}
.appbar h1,.appbar .ab-t{font-size:18px;font-weight:800;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ibtn{width:40px;height:40px;border-radius:50%;border:0;display:grid;place-items:center;cursor:pointer;background:var(--sunk);color:var(--ink);position:relative;flex:none;text-decoration:none}
.ibtn.dark,.appbar .ibtn{background:var(--case-2);color:var(--case-ink)}
.ibtn.glass{background:rgb(0 0 0 / .45);color:#fff;backdrop-filter:blur(6px)}
.fav2[aria-pressed="true"] svg{fill:var(--tally);color:var(--tally)}
.sfield{flex:1;display:flex;align-items:center;gap:8px;background:var(--surface);color:var(--ink);border-radius:12px;height:42px;padding:0 12px;min-width:0}
.sfield input{border:0;background:none;outline:none;flex:1;min-width:0}
.sfield svg{color:var(--muted);flex:none}
.fchips{display:flex;gap:6px;overflow-x:auto;padding:10px 14px;background:var(--surface);border-bottom:1px solid var(--line);scrollbar-width:none;position:sticky;top:58px;z-index:9}
.fchips::-webkit-scrollbar{display:none}
.fchip{flex:none;height:34px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:700;font-size:14px;cursor:pointer}
.fchip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.pad{padding:16px}
.stack{display:grid;gap:14px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.rhead{margin-bottom:12px;align-items:center}
.rhead select{width:auto;height:36px;font-size:14px}

/* Início */
.home-h{background:var(--case);color:var(--case-ink);padding:8px 16px 22px;display:grid;gap:8px;border-radius:0 0 24px 24px}
.home-top{display:flex;justify-content:space-between;align-items:center}
.home-top .logo{font-size:24px}
.hello{color:var(--case-muted);font-size:14px;margin-top:10px}
.home-t{font-family:var(--stencil);font-weight:900;text-transform:uppercase;font-size:35px;line-height:.9;letter-spacing:.01em}
.home-t em{color:var(--cue);font-style:normal}
.fakesearch{display:flex;align-items:center;gap:10px;background:var(--surface);color:var(--muted);border-radius:12px;height:46px;padding:0 14px;text-decoration:none;margin-top:8px}
.hcats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:18px 12px 8px}
.hcats a{display:grid;justify-items:center;gap:6px;text-decoration:none;font-size:12.5px;font-weight:700}
.hcats .ci{width:56px;height:56px;border-radius:17px;background:var(--surface);display:grid;place-items:center;box-shadow:0 1px 2px rgb(0 0 0 / .06)}
.hcats a:first-child .ci{background:var(--cue);color:var(--cue-ink)}
.rail{display:grid;gap:10px;padding-block:10px}
.rail-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.rail .rail-h,.sec-h>.rail-h{padding-inline:16px}
.rail-h h2{font-size:18px;font-weight:800}
.rowscroll{display:grid;grid-auto-flow:column;grid-auto-columns:166px;gap:10px;overflow-x:auto;padding:0 16px 6px;scroll-snap-type:x mandatory;scroll-padding-inline:16px;scrollbar-width:none}
.rowscroll::-webkit-scrollbar{display:none}
.rowscroll .ad{scroll-snap-align:start}
.sec-h{display:grid;gap:10px;padding-block:10px 24px}
.sec-h .ads{padding-inline:16px}
.promo{margin:4px 16px 6px}

/* Cards no app */
.ad .price{font-size:16px}
.ad h3{font-size:14px}
.ad .tape{font-size:10px;padding:5px 7px 4px}
.fav{width:34px;height:34px}

/* Anúncio */
.det{min-height:100%;display:flex;flex-direction:column}
.gal-wrap{position:relative;background:var(--case)}
.gal-s{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
.gal-s::-webkit-scrollbar{display:none}
.gs{flex:0 0 100%;scroll-snap-align:start}
.gs .cover{aspect-ratio:1/1}
.gs .poster{padding-top:68px;padding-bottom:46px}
.gal-top{position:absolute;top:10px;left:12px;right:12px;display:flex;justify-content:space-between}
.gal-n{position:absolute;right:12px;bottom:12px;background:rgb(0 0 0 / .55);color:#fff;font:600 12px/1 var(--mono);padding:5px 9px;border-radius:999px}
.det-b{padding:16px;display:grid;gap:16px;flex:1}
.det .adh{display:grid;gap:6px}
.det .adh h1{font-size:25px;font-weight:800;line-height:1.15}
.det .adh .price{font-size:26px;margin:0}
.seller-row{display:flex;gap:12px;align-items:center;padding:12px;border-radius:14px;background:var(--surface)}
.seller-row div{display:grid;min-width:0;flex:1}
.seller-row small{color:var(--muted);font-size:13px}
.dsec{display:grid;gap:10px;padding-top:16px;border-top:1px solid var(--line)}
.dsec>h2{font-size:17px;font-weight:800}
.actbar{position:sticky;bottom:0;display:grid;grid-template-columns:1fr 1.5fr;gap:8px;padding:10px 14px 12px;background:var(--surface);border-top:1px solid var(--line);z-index:5}
.actbar .block{grid-column:1/-1}
.cmpl{list-style:none;margin:0;padding:0;display:grid}
.cmpl li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;padding:11px 0;border-top:1px solid var(--line);align-items:start}
.cmpl li:first-child{border-top:0}
.cmpl .note{display:block}
.members{grid-template-columns:1fr}
.attrs{grid-template-columns:1fr}

/* Folha inferior (bottom sheet) */
#sheet{position:absolute;inset:0;z-index:40}
.sh-bg{position:absolute;inset:0;background:rgb(0 0 0 / .45);opacity:0;transition:opacity .2s}
.sh{position:absolute;left:0;right:0;bottom:0;max-height:90%;overflow-y:auto;background:var(--surface);border-radius:24px 24px 0 0;padding:8px 18px 22px;display:grid;gap:14px;translate:0 100%;transition:translate .24s cubic-bezier(.2,.8,.2,1);overscroll-behavior:contain}
#sheet.open .sh-bg{opacity:1}
#sheet.open .sh{translate:0 0}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);justify-self:center}
.sh-h{display:flex;justify-content:space-between;align-items:center;gap:10px}
.sh-h h2{font-size:19px;font-weight:800}

/* Perfil */
.me-card{display:flex;gap:14px;align-items:center;background:var(--case);color:var(--case-ink);border-radius:18px;padding:16px}
.me-card p{color:var(--case-muted);font-size:13px}
.me-card strong{font-size:18px}
.mlinks{display:grid;background:var(--surface);border-radius:14px;overflow:hidden}
.mlinks a,.mlinks button{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 16px;border:0;background:none;text-decoration:none;font-weight:600;border-top:1px solid var(--line);cursor:pointer;text-align:left;width:100%}
.mlinks>:first-child{border-top:0}
.mlinks .n{background:var(--sunk);border-radius:999px;padding:1px 8px;font-size:13px}
.prow{grid-template-columns:88px minmax(0,1fr);gap:12px}
.prow .acts{grid-column:1/-1;justify-content:flex-start}
.prop{grid-template-columns:auto minmax(0,1fr);padding:14px}
.prop>:last-child{grid-column:1/-1;justify-content:flex-start!important}

/* Entrar */
.auth-m{padding:22px 18px 32px;display:grid;gap:18px}
.auth-m .logo{justify-self:start}
.auth-m h1{font-size:26px;font-weight:800;line-height:1.15}

/* Editor no app */
.ed{padding-block:12px 0;gap:16px}
.steps{position:sticky;top:58px;z-index:8;background:var(--bg);padding-block:6px;margin-inline:-16px;padding-inline:16px}
.savebar{position:sticky;bottom:0}
.savebar .wrap{padding-block:10px;gap:8px}
.savebar .btn.ghost{display:none}
.savebar .msg{font-size:12px}
.savebar .btn{height:40px;padding:0 14px}
.eform .box{padding:18px}
.newgrid{gap:12px}

/* ================= Regras: rider × estrutura ================= */
function compare(rider, equip) {
  const rows = [];
  for (const [id, v] of Object.entries(rider.items)) {
    const it = ITEM[id]; if (!it) continue;
    const have = equip.items[id]?.q || 0, need = v.q;
    const st = have >= need ? "ok" : have > 0 ? "parcial" : "falta";
    const why = st === "ok" ? "Atende a quantidade pedida" : st === "parcial" ? `Falta${need - have > 1 ? "m" : ""} ${need - have} ${it.unit}` : "A casa não tem este item cadastrado";
    rows.push({ name: it.name, unit: it.unit, need, have, st, why, obs: v.obs });
  }
  rider.outros.forEach(o => rows.push({ name: o.name, unit: "un", need: o.q, have: null, st: "conferir", why: "Item fora do catálogo. Combine direto com a casa.", obs: o.obs }));
  const order = { falta: 0, parcial: 1, conferir: 2, ok: 3 };
  return rows.sort((a, b) => order[a.st] - order[b.st] || a.name.localeCompare(b.name));
}

function vNovo() {

      <button class="newc" data-act="novo" data-v="c">${demoE("c", "Sua casa", { tipo: "Casa de show", bairro: "Centro", capacidade: "?" })}<strong style="font-size:18px">Casa de show</strong><span class="muted">Endereço, capacidade, fotos e estrutura do palco.</span></button>
    </div></div>`;
}
function vAuth(mode) {

  return appbar(isIn ? "Entrar" : "Criar conta", { h1: false }) + `<div class="auth-m"><h1 tabindex="-1">${isIn ? "Escolha um usuário pronto ou entre com e-mail" : "Crie sua conta grátis"}</h1>
    ${flash ? `<div class="inline-msg info">${esc(flash)}</div>` : ""}
    ${isIn ? `<div class="demo">${PERSONAS.slice(1).map(([id, n, d]) => `<button data-act="persona" data-v="${id}">${pAvatar(id)}<span><strong>${n}</strong><small>${d}</small></span></button>`).join("")}<button data-act="personas" style="justify-content:center;font-weight:700">Ver todos os usuários</button></div><div class="or">ou com e-mail</div>` : ""}

      <label class="field"><span>Senha</span><input class="input" id="a-senha" name="senha" type="password" autocomplete="${isIn ? "current-password" : "new-password"}" ${isIn ? 'value="demonstracao"' : ""}>${isIn ? "" : "<small>Mínimo de 8 caracteres.</small>"}<span class="err" data-err="senha"></span></label>
      <span class="err" data-err="form"></span><button class="btn cue" type="submit" style="height:48px">${isIn ? "Entrar" : "Criar conta"}</button></form>
    <p class="note" style="text-align:center">${isIn ? `Não tem conta? <a class="link" href="#criar-conta">Criar conta</a>` : `Já tem conta? <a class="link" href="#entrar">Entrar</a>`}</p></div>`;
}
function vNotFound() { return appbar("Não encontrado") + `<div class="pad"><div class="empty"><strong>Página não encontrada</strong><span>O anúncio pode ter sido removido.</span><a class="btn cue" href="#inicio">Ir para o início</a></div></div>`; }
function gate(msg, after) { ui.flash = msg; ui.after = after || null; history.replaceState(null, "", "#entrar"); return vAuth("entrar"); }

/* ---- Roteador ---- */
function resolve() {
  const h = route0(); let m;
  if (h === "inicio") return vInicio();
  if (h === "buscar") return vBuscar();
  if (h === "entrar") return vAuth("entrar");
  if (h === "criar-conta") return vAuth("criar");
  if (h === "perfil" || h === "minha-conta") return vPerfil();
  if (h === "favoritos") return vFavoritos();
  if (h === "propostas") return acct() ? vPropostas() : gate("Entre para ver suas propostas.", "propostas");
  if (h === "novo-perfil") return acct() ? vNovo() : gate("Entre para criar um perfil.", "novo-perfil");
  if ((m = h.match(/^editar-([mbc])-([\w-]+)$/))) return acct() ? appbar("Editar anúncio", { h1: false }) + vEditar(m[1], m[2]) : gate("Entre para editar.", h);
  if ((m = h.match(/^m-([\w-]+)$/))) return vMusico(m[1]);
  if ((m = h.match(/^b-([\w-]+)$/))) return vBanda(m[1]);
  if ((m = h.match(/^c-([\w-]+)$/))) return vCasa(m[1]);
  return vNotFound();
}
function go(h) { if (route0() === h && location.hash) render(); else location.hash = h; }
let lastHash = null;
function render() {
  const html = resolve(); $("#app").innerHTML = html; renderTabbar(); renderPanel();
  if (location.hash !== lastHash) { const first = lastHash === null; lastHash = location.hash; $("#app").scrollTop = 0; if (!first) $("#app h1[tabindex]")?.focus({ preventScroll: true }); }
}
window.addEventListener("hashchange", () => {
  if (ui.ed?.dirty && !location.hash.startsWith("#editar-")) toast("Alterações do editor descartadas");
  if (!location.hash.startsWith("#editar-")) ui.ed = null;
  ui.nav++; closeSheet(true); render();
});

/* ---- Eventos ---- */
function rfield() { return $("#rfield")?.value; }
function rerenderSec(id) { const s = $("#sec-" + id); if (!s) return; const k = ui.ed.key[0], e = ui.ed.e; const t = s.querySelector("h2").outerHTML; s.innerHTML = t + { contato: () => secContato(k, e), integrantes: () => secMembros(e), resp: () => secResp(e), fotos: () => secFotos(e) }[id](); }
document.addEventListener("click", e => {
  const el = e.target.closest("[data-act]"); if (!el) return;
  const a = el.dataset.act, v = el.dataset.v, ed = ui.ed?.e;
  switch (a) {
    case "skip": e.preventDefault(); $("#app").focus(); break;
    case "back": if (ui.nav > 0) history.back(); else go("inicio"); break;
    case "persona": setPersona(v); break;
    case "personas": personasSheet(); break;
    case "close": closeSheet(); break;
    case "logout": setPersona(""); break;
    case "kindgo": ui.instr = ""; ui.comRider = false; ui.kind = v; break;
    case "kind": ui.kind = v; ui.instr = ""; render(); break;
    case "instr": ui.instr = ui.instr === v ? "" : v; ui.kind = ui.instr ? "m" : "todos"; render(); break;
    case "city": ui.cidade = v; ui.kind = "todos"; break;
    case "clearf": Object.assign(ui, { q: "", cidade: "", estilos: [], cacheMax: 3000, formacao: "", comRider: false, instr: "", kind: "todos" }); closeSheet(true); render(); break;
    case "filters": filtersSheet(); break;
    case "fav": { const i = DB.favs.indexOf(v); if (i < 0) { DB.favs.push(v); toast("Salvo nos favoritos"); } else { DB.favs.splice(i, 1); toast("Removido dos favoritos"); } save(); $$(`[data-act=fav][data-v="${v}"]`).forEach(b => b.setAttribute("aria-pressed", DB.favs.includes(v))); break; }
    case "share": navigator.clipboard?.writeText(location.href).then(() => toast("Link copiado"), () => toast("Não foi possível copiar")); break;
    case "contato": if (!acct()) gate("Entre para ver o contato.", route0()), render(); else contatoSheet(v); break;
    case "copy": navigator.clipboard?.writeText(v).then(() => toast("Copiado"), () => toast("Selecione o texto para copiar")); break;
    case "proposta": openProposta(v); if (!acct()) render(); break;
    case "compare": ui.cmp[v] = $(`#${el.dataset.src}-${v}`).value; render(); requestAnimationFrame(() => $("#s-cmp")?.scrollIntoView({ behavior: "smooth", block: "start" })); break;
    case "go": go(v); break;
    case "ptab": ui.propTab = v; render(); break;
    case "pst": { const p = DB.propostas.find(x => x.id === el.dataset.id); p.status = v; save(); toast(v === "ACEITA" ? "Proposta aceita. Combinem os detalhes do show." : "Proposta recusada"); render(); break; }
    case "novo": createDraft(v); break;
    case "reset": store.clear(); DB = addAccounts(seed()); save(); Object.assign(ui, { ed: null, cmp: {}, contato: {}, favs: [] }); toast("Dados de exemplo restaurados"); go("inicio"); break;
    case "jump": e.preventDefault(); document.getElementById(v)?.scrollIntoView({ behavior: "smooth" }); break;
    case "jumpf": { e.preventDefault(); const t = $(`[data-err="${v}"]`); t?.closest("section")?.scrollIntoView({ behavior: "smooth", block: "start" }); t?.closest(".field,fieldset")?.querySelector("input,textarea,select")?.focus({ preventScroll: true }); break; }
    case "edsave": edSave(v); break;
    case "rmfoto": ed.fotos.splice(+v, 1); rerenderSec("fotos"); touch(); break;
    case "pfadd": ed.portfolio = ed.portfolio || []; ed.portfolio.push({ tipo: "Áudio", titulo: "", url: "" }); rerenderSec("contato"); $("#pf-rows .dynrow:last-child [data-pf=titulo]")?.focus(); touch(); break;
    case "pfrm": ed.portfolio.splice(+el.closest(".dynrow").dataset.i, 1); rerenderSec("contato"); touch(); break;
    case "robsopen": { const row = el.closest(".rrow"); row.classList.add("showobs"); row.querySelector(".robs").focus(); break; }
    case "rstep": { const row = el.closest(".rrow"), id = row.dataset.item, r = ed[rfield()]; if (!r.items[id]) break; r.items[id].q = Math.max(1, Math.min(999, r.items[id].q + +el.dataset.d)); row.querySelector("output").textContent = r.items[id].q; touch(); break; }
    case "oadd": { const r = ed[rfield()]; r.outros.push({ name: "", q: 1, obs: "" }); $("#outros").innerHTML = outrosRows(r); $(`#on-${r.outros.length - 1}`).focus(); touch(); break; }
    case "orm": { const r = ed[rfield()]; r.outros.splice(+el.closest(".orow").dataset.i, 1); $("#outros").innerHTML = outrosRows(r); touch(); break; }
    case "minv": { const mid = $("#m-inv").value; if (!mid) break; ed.membros.push({ id: mid, role: "MEMBER", pend: true }); rerenderSec("integrantes"); $("#mmsg").innerHTML = `<div class="inline-msg ok">Convite para ${esc(DB.musicos[mid].nome)} será enviado ao salvar.</div>`; touch(); break; }
    case "mrm": { const mid = el.dataset.m, m = ed.membros.find(x => x.id === mid); if (m.role === "OWNER" && ed.membros.filter(x => x.role === "OWNER" && !x.pend).length === 1) { $("#mmsg").innerHTML = `<div class="inline-msg bad">A banda precisa de pelo menos um responsável.</div>`; break; } ed.membros = ed.membros.filter(x => x.id !== mid); rerenderSec("integrantes"); touch(); break; }
    case "rinv": { const em = $("#r-inv").value.trim(), er = V.email(em); $("#r-inv-err").textContent = er; if (er) break; ed.membros.push({ id: "inv-" + em, email: em, role: "ADMIN", pend: true }); rerenderSec("resp"); touch(); break; }

  }

document.addEventListener("scroll", e => {
  const g = e.target; if (!(g instanceof Element) || !g.matches("[data-gal]")) return;
  const n = Math.round(g.scrollLeft / g.clientWidth) + 1, el = $("#gn"); if (el) el.textContent = n;
}, true);
document.addEventListener("input", e => {
  const el = e.target;
  if (el.id === "sq") { ui.q = el.value; return refreshResults(); }
  if (el.dataset.filter === "cacheMax") { ui.cacheMax = +el.value; return refreshResults(); }
  if (!ui.ed) return;
  const ed = ui.ed.e;
  if (el.dataset.f) { setPath(ed, el.dataset.f, el.hasAttribute("data-num") ? (el.value === "" ? "" : +el.value) : el.value); return touch(); }
  if (el.dataset.pf) { ed.portfolio[+el.closest(".dynrow").dataset.i][el.dataset.pf] = el.value; return touch(); }
  const a = el.dataset.actInput; if (!a) return;
  const r = ed[rfield()];
  if (a === "robs") { const id = el.closest(".rrow").dataset.item; if (r.items[id]) r.items[id].obs = el.value; }
  else { const o = r.outros[+el.closest(".orow").dataset.i]; if (a === "oname") o.name = el.value; if (a === "oq") o.q = Math.max(1, +el.value || 1); if (a === "oobs") o.obs = el.value; }
  touch();
});
document.addEventListener("change", e => {
  const el = e.target, f = el.dataset.filter;
  if (f) {
    if (f === "cidade") ui.cidade = el.value;
    else if (f === "estilos") ui.estilos = el.checked ? [...ui.estilos, el.value] : ui.estilos.filter(s => s !== el.value);
    else if (f === "comRider") ui.comRider = el.checked;
    else if (f === "cacheMax") ui.cacheMax = +el.value;
    else ui[f] = el.value;
    refreshResults();
    const nf = activeFilters(), btn = $("[data-act=filters]"); if (btn) { const b = btn.querySelector(".badge"); if (nf) { if (b) b.textContent = nf; else btn.insertAdjacentHTML("beforeend", `<i class="badge">${nf}</i>`); } else b?.remove(); }
    return;
  }
  if (!ui.ed) return;
  const ed = ui.ed.e, a = el.dataset.actChange;
  if (el.dataset.f && el.tagName === "SELECT") { setPath(ed, el.dataset.f, el.value); return touch(); }
  if (el.dataset.fa) { const arr = ed[el.dataset.fa] = ed[el.dataset.fa] || []; if (el.checked) arr.push(el.value); else arr.splice(arr.indexOf(el.value), 1); return touch(); }
  if (a === "rtoggle") { const row = el.closest(".rrow"), id = row.dataset.item, r = ed[rfield()]; if (el.checked) r.items[id] = { q: +row.querySelector("output").textContent || 1, obs: "" }; else { delete r.items[id]; row.classList.remove("showobs"); } row.classList.toggle("on", el.checked); return touch(); }
  if (a === "mrole") { const m = ed.membros.find(x => x.id === el.dataset.m); if (m.role === "OWNER" && el.value !== "OWNER" && ed.membros.filter(x => x.role === "OWNER" && !x.pend).length === 1) { el.value = "OWNER"; $("#mmsg").innerHTML = `<div class="inline-msg bad">A banda precisa de pelo menos um responsável. Promova outra pessoa antes.</div>`; return; } m.role = el.value; $("#mmsg").innerHTML = ""; return touch(); }
  if (a === "foto") {
    const file = el.files[0], err = $("[data-err=foto]"); if (!file) return;
    if (file.size > 1.5 * 1024 * 1024) { err.textContent = "A imagem passa de 1,5 MB. Escolha um arquivo menor."; return; }
    const rd = new FileReader(); rd.onload = () => { ed.fotos = ed.fotos || []; ed.fotos.push(rd.result); if (ui.ed.key[0] === "m") ed.foto = ed.fotos[0]; rerenderSec("fotos"); touch(); }; rd.readAsDataURL(file);
  }
});
document.addEventListener("submit", e => {
  e.preventDefault(); const f = e.target;
  if (f.id === "f-auth") {
    const d = Object.fromEntries(new FormData(f)), mode = f.dataset.mode;
    const errs = { email: V.email(d.email || ""), senha: V.senha(d.senha || "") }; if (mode === "criar") errs.nome = V.nome(d.nome);
    if (!showErrs(f, errs)) return;
    const email = d.email.trim().toLowerCase(), found = Object.values(DB.contas).find(c => c.email === email);
    if (mode === "entrar") { if (!found) return showErrs(f, { form: "Não encontramos uma conta com esse e-mail. Escolha um usuário pronto acima ou crie uma conta." }); DB.user = found.id; }
    else { if (found) return showErrs(f, { email: "Já existe uma conta com esse e-mail. Use Entrar." }); const id = uid("u"); DB.contas[id] = { id, nome: d.nome.trim(), email, musico: null, desde: YEAR }; DB.user = id; }
    save(); toast(mode === "entrar" ? `Olá, ${DB.contas[DB.user].nome.split(" ")[0]}` : "Conta criada"); const nx = ui.after || (mode === "entrar" ? "perfil" : "novo-perfil"); ui.after = null; go(nx); return;
  }
  if (f.id === "f-prop") {
    const d = Object.fromEntries(new FormData(f));
    if (!showErrs(f, { d: d.d ? "" : "Escolha a data do show.", msg: (d.msg || "").trim().length >= 10 ? "" : "Escreva uma mensagem com pelo menos 10 caracteres." })) return;
    DB.propostas.push({ id: uid("p"), from: d.from, to: f.dataset.to, d: d.d, hora: d.hora, dur: d.dur, cache: +d.cache || 0, msg: d.msg.trim(), status: "PENDENTE", criado: new Date().toISOString().slice(0, 16) });
    save(); closeSheet(); toast(`Proposta enviada para ${get(f.dataset.to).nome}`); ui.propTab = "enviadas"; return;
  }
});
document.addEventListener("keydown", e => { if (e.key === "Escape") closeSheet(); });

tickClock(); setInterval(tickClock, 30000);
render();
</script>
