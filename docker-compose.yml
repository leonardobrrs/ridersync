# Ambiente local do RiderSync.
#  - Somente banco:      docker compose up -d db
#  - Aplicação completa: docker compose up --build
# Um único backend (monólito modular NestJS) e um único PostgreSQL.
name: ridersync

services:
  db:
    image: docker.io/library/postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ridersync}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ridersync_dev_only}
      POSTGRES_DB: ${POSTGRES_DB:-ridersync}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./backend/docker/init-test-db.sql:/docker-entrypoint-initdb.d/10-test-db.sql:ro,z
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ridersync} -d ${POSTGRES_DB:-ridersync}"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      # production por padrão; para dados demo use API_NODE_ENV=development SEED_DEMO=true
      NODE_ENV: ${API_NODE_ENV:-production}
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-ridersync}:${POSTGRES_PASSWORD:-ridersync_dev_only}@db:5432/${POSTGRES_DB:-ridersync}?schema=public
      # Atrás do proxy do serviço "web" (mesma origem). Em HTTPS real use COOKIE_SECURE=true.
      COOKIE_SECURE: "false"
      CORS_ORIGINS: http://localhost:${WEB_PORT:-8080}
      STORAGE_DRIVER: local
      STORAGE_LOCAL_DIR: /app/storage
      SEED_DEMO: ${SEED_DEMO:-false}
    volumes:
      - api-storage:/app/storage
    ports:
      - "${API_PORT:-3000}:3000"

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-8080}:80"

volumes:
  db-data:
  api-storage:
